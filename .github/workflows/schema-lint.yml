name: schema-lint

on:
  push:
    paths:
      - "lib/**"
      - "bin/**"
      - "examples/**"
      - "skills/**"
      - "tools/schema-lint.py"
      - ".github/workflows/schema-lint.yml"
  pull_request:
    paths:
      - "lib/**"
      - "bin/**"
      - "examples/**"
      - "skills/**"
  workflow_dispatch:

jobs:
  schema-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check DSH tool schema compliance
        run: |
          status=0
          for d in lib bin examples skills scripts; do
            [ -d "$d" ] || continue
            while IFS= read -r f; do
              python3 tools/schema-lint.py "$f" || status=1
            done < <(find "$d" -type f \( -name '*.js' -o -name '*.mjs' \) | grep -v node_modules)
          done
          exit $status
